x-airflow-common: &airflow-common
  build: .
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    PYTHONPATH: /opt/airflow
    DB_HOST: postgres_crypto
    DB_PORT: 5432
    DB_NAME: ${DB_NAME}
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    COINGECKO_BASE_URL: ${COINGECKO_BASE_URL}
    COINGECKO_API_KEY: ${COINGECKO_API_KEY}
    # --- crypto-market-rag config (rag_src/utils/config.py) -----------------
    # Different env var names from DB_* above (POSTGRES_* vs DB_*), so no
    # collision even though both point at the same postgres_crypto container.
    # rag_user (not DB_USER/crypto_user) - least-privilege role from
    # vector_schema.sql, read-only on dim_coins/fact_coin_prices.
    POSTGRES_HOST: postgres_crypto
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${DB_NAME}
    POSTGRES_USER: ${RAG_DB_USER}
    POSTGRES_PASSWORD: ${RAG_DB_PASSWORD}
    # Ollama runs on the HOST (laptop), not in a container - host.docker.internal
    # is how a container reaches services running on its host machine.
    OLLAMA_HOST: http://host.docker.internal:11434
    OLLAMA_EMBEDDING_MODEL: nomic-embed-text
    OLLAMA_CHAT_MODEL: llama3.1:8b
    LOG_LEVEL: INFO
    ENVIRONMENT: production
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    # --- crypto-market-rag mounts --------------------------------------------
    # Sibling project directory, assumed at ../crypto-market-rag relative to
    # this docker-compose.yml. Adjust the path if your folder layout differs.
    - ../crypto-market-rag/dags:/opt/airflow/dags/rag
    - ../crypto-market-rag/rag_src:/opt/airflow/rag_src
  # Required on Linux Docker Engine for host.docker.internal to resolve
  # (on Docker Desktop for Mac/Windows this is automatic, but explicit here
  # doesn't hurt and keeps this file portable).
  extra_hosts:
    - "host.docker.internal:host-gateway"
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres_airflow:
      condition: service_healthy

services:
  postgres_crypto:
    image: pgvector/pgvector:pg16
    container_name: crypto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - crypto_postgres_data:/var/lib/postgresql/data
      - ./postgres/sql:/docker-entrypoint-initdb.d

  postgres_airflow:
    image: postgres:16
    container_name: airflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

volumes:
  crypto_postgres_data:
  airflow_postgres_data:
