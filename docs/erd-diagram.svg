<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5c6773"/>
    </marker>
  </defs>

  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">Database Schema (ERD)</text>

  <!-- dim_coins -->
  <rect x="60" y="80" width="240" height="180" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="60" y="80" width="240" height="34" rx="8" fill="#2563eb"/>
  <text x="180" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">dim_coins</text>
  <text x="78" y="134" font-size="12" fill="#1e3a8a" font-weight="700">🔑 coin_id</text>
  <text x="200" y="134" font-size="11" fill="#1e3a8a">VARCHAR(100)</text>
  <text x="78" y="156" font-size="12" fill="#1e3a8a">symbol</text>
  <text x="200" y="156" font-size="11" fill="#1e3a8a">VARCHAR(100)</text>
  <text x="78" y="178" font-size="12" fill="#1e3a8a">name</text>
  <text x="200" y="178" font-size="11" fill="#1e3a8a">VARCHAR(300)</text>
  <text x="78" y="200" font-size="12" fill="#1e3a8a">loaded_at</text>
  <text x="200" y="200" font-size="11" fill="#1e3a8a">TIMESTAMP</text>
  <text x="78" y="230" font-size="10" fill="#3b5bab">source: /coins/list</text>

  <!-- fact_coin_prices -->
  <rect x="400" y="80" width="260" height="260" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="400" y="80" width="260" height="34" rx="8" fill="#16a34a"/>
  <text x="530" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">fact_coin_prices</text>
  <text x="418" y="134" font-size="12" fill="#14532d" font-weight="700">🔑 id</text>
  <text x="560" y="134" font-size="11" fill="#14532d">SERIAL</text>
  <text x="418" y="156" font-size="12" fill="#14532d" font-weight="700">🔗 coin_id</text>
  <text x="560" y="156" font-size="11" fill="#14532d">FK → dim_coins</text>
  <text x="418" y="178" font-size="12" fill="#14532d">price_date</text>
  <text x="560" y="178" font-size="11" fill="#14532d">DATE</text>
  <text x="418" y="200" font-size="12" fill="#14532d">price_usd</text>
  <text x="560" y="200" font-size="11" fill="#14532d">NUMERIC(20,8)</text>
  <text x="418" y="222" font-size="12" fill="#14532d">market_cap_usd</text>
  <text x="560" y="222" font-size="11" fill="#14532d">NUMERIC(20,2)</text>
  <text x="418" y="244" font-size="12" fill="#14532d">volume_24h_usd</text>
  <text x="560" y="244" font-size="11" fill="#14532d">NUMERIC(20,2)</text>
  <text x="418" y="266" font-size="12" fill="#14532d">processed_at</text>
  <text x="560" y="266" font-size="11" fill="#14532d">TIMESTAMP</text>
  <text x="418" y="296" font-size="10" fill="#166534">UNIQUE (coin_id, price_date)</text>
  <text x="418" y="313" font-size="10" fill="#166534">source: /coins/markets + /market_chart</text>

  <!-- relationship line -->
  <line x1="300" y1="160" x2="395" y2="160" stroke="#5c6773" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="345" y="150" text-anchor="middle" font-size="10" fill="#5c6773">1 : N</text>

  <!-- pipeline_run_log -->
  <rect x="720" y="80" width="160" height="220" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <rect x="720" y="80" width="160" height="34" rx="8" fill="#db2777"/>
  <text x="800" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">pipeline_run_log</text>
  <text x="735" y="134" font-size="11" fill="#831843" font-weight="700">🔑 id</text>
  <text x="735" y="156" font-size="11" fill="#831843">run_date</text>
  <text x="735" y="178" font-size="11" fill="#831843">stage</text>
  <text x="735" y="200" font-size="11" fill="#831843">status</text>
  <text x="735" y="222" font-size="11" fill="#831843">rows_processed</text>
  <text x="735" y="244" font-size="11" fill="#831843">error_message</text>
  <text x="735" y="272" font-size="9" fill="#9d174d">no FK — standalone</text>
  <text x="735" y="286" font-size="9" fill="#9d174d">monitoring table</text>

  <!-- Views -->
  <rect x="60" y="360" width="820" height="90" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="80" y="384" font-size="13" font-weight="700" fill="#374151">Monitoring Views (02_views.sql)</text>
  <text x="80" y="408" font-size="11" fill="#374151">v_price_anomalies — LAG() window function, detects abnormal daily price jumps</text>
  <text x="80" y="425" font-size="11" fill="#374151">v_missing_dates — generate_series + LEFT JOIN, detects gaps in daily pipeline runs</text>
  <text x="80" y="442" font-size="11" fill="#374151">v_pipeline_health — aggregated summary from pipeline_run_log</text>
</svg>
