<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5c6773"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">crypto-market-pipeline — Architecture</text>

  <!-- Source -->
  <rect x="40" y="80" width="150" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="115" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">CoinGecko</text>
  <text x="115" y="123" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">API</text>

  <!-- Extraction -->
  <rect x="240" y="80" width="150" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="315" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Extraction</text>
  <text x="315" y="123" text-anchor="middle" font-size="11" fill="#1e40af">Python + requests</text>

  <!-- Transformation -->
  <rect x="440" y="80" width="170" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="525" y="102" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Transformation</text>
  <text x="525" y="119" text-anchor="middle" font-size="11" fill="#1e40af">PySpark + Quality Gate</text>
  <text x="525" y="133" text-anchor="middle" font-size="10" fill="#3b5bab">(null / dedup / range check)</text>

  <!-- Loading -->
  <rect x="660" y="80" width="150" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="735" y="102" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Loading</text>
  <text x="735" y="119" text-anchor="middle" font-size="11" fill="#1e40af">Staging + Upsert</text>
  <text x="735" y="133" text-anchor="middle" font-size="10" fill="#3b5bab">(psycopg2 ON CONFLICT)</text>

  <!-- PostgreSQL -->
  <rect x="860" y="80" width="105" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="912" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">PostgreSQL</text>
  <text x="912" y="123" text-anchor="middle" font-size="11" fill="#166534">crypto_market_db</text>

  <!-- Arrows top row -->
  <line x1="190" y1="110" x2="235" y2="110" stroke="#5c6773" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="110" x2="435" y2="110" stroke="#5c6773" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610" y1="110" x2="655" y2="110" stroke="#5c6773" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="110" x2="855" y2="110" stroke="#5c6773" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tables inside postgres -->
  <rect x="850" y="190" width="125" height="130" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="912" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">Tables</text>
  <text x="912" y="234" text-anchor="middle" font-size="11" fill="#374151">dim_coins</text>
  <text x="912" y="254" text-anchor="middle" font-size="11" fill="#374151">fact_coin_prices</text>
  <text x="912" y="274" text-anchor="middle" font-size="11" fill="#374151">pipeline_run_log</text>
  <line x1="912" y1="140" x2="912" y2="185" stroke="#5c6773" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Monitoring views -->
  <rect x="850" y="345" width="125" height="130" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="912" y="367" text-anchor="middle" font-size="12" font-weight="700" fill="#9d174d">Monitoring Views</text>
  <text x="912" y="389" text-anchor="middle" font-size="10" fill="#9d174d">v_price_anomalies</text>
  <text x="912" y="407" text-anchor="middle" font-size="10" fill="#9d174d">v_missing_dates</text>
  <text x="912" y="425" text-anchor="middle" font-size="10" fill="#9d174d">v_pipeline_health</text>
  <line x1="912" y1="320" x2="912" y2="340" stroke="#5c6773" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Airflow orchestration box -->
  <rect x="240" y="220" width="570" height="120" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="525" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">Orchestrated by Apache Airflow</text>

  <rect x="265" y="262" width="245" height="58" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="387" y="284" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">crypto_daily_pipeline</text>
  <text x="387" y="302" text-anchor="middle" font-size="10" fill="#5b21b6">@daily — dim_coins + market snapshot</text>

  <rect x="525" y="262" width="245" height="58" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="647" y="284" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">crypto_backfill_pipeline</text>
  <text x="647" y="302" text-anchor="middle" font-size="10" fill="#5b21b6">manual trigger — 365-day history</text>

  <line x1="525" y1="140" x2="525" y2="215" stroke="#5c6773" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Docker box -->
  <rect x="40" y="420" width="935" height="150" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="70" y="448" font-size="14" font-weight="700" fill="#075985">Docker Compose</text>

  <rect x="70" y="465" width="180" height="80" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
  <text x="160" y="490" text-anchor="middle" font-size="12" font-weight="600" fill="#075985">postgres_crypto</text>
  <text x="160" y="508" text-anchor="middle" font-size="10" fill="#075985">crypto_market_db</text>
  <text x="160" y="524" text-anchor="middle" font-size="10" fill="#075985">port 5432</text>

  <rect x="280" y="465" width="180" height="80" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
  <text x="370" y="490" text-anchor="middle" font-size="12" font-weight="600" fill="#075985">postgres_airflow</text>
  <text x="370" y="508" text-anchor="middle" font-size="10" fill="#075985">metadata DB</text>
  <text x="370" y="524" text-anchor="middle" font-size="10" fill="#075985">internal only</text>

  <rect x="490" y="465" width="180" height="80" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
  <text x="580" y="490" text-anchor="middle" font-size="12" font-weight="600" fill="#075985">airflow-webserver</text>
  <text x="580" y="508" text-anchor="middle" font-size="10" fill="#075985">UI, port 8080</text>
  <text x="580" y="524" text-anchor="middle" font-size="10" fill="#075985">Java 17 + Poetry</text>

  <rect x="700" y="465" width="180" height="80" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
  <text x="790" y="490" text-anchor="middle" font-size="12" font-weight="600" fill="#075985">airflow-scheduler</text>
  <text x="790" y="508" text-anchor="middle" font-size="10" fill="#075985">DAG execution</text>
  <text x="790" y="524" text-anchor="middle" font-size="10" fill="#075985">Java 17 + Poetry</text>

  <text x="500" y="605" text-anchor="middle" font-size="11" fill="#6b7280">Extraction → Transformation (Quality Gate) → Loading (Staging + Upsert) → Monitoring Views</text>
</svg>
